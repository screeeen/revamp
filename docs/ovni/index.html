    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "OVNI",
        "description": "OVNI, el juego de laberintos de js13k portado a Sega Mega Drive con SGDK. Se juega en el navegador, sin instalar nada.",
        "url": "https://screenimplosion.com/ovni/",
        "inLanguage": "es",
        "gamePlatform": ["Sega Mega Drive", "Sega Genesis", "Web browser"],
        "image": "https://screenimplosion.com/images/og-card.png",
        "publisher": {
          "@type": "Organization",
          "name": "Screen Implosion",
          "url": "https://screenimplosion.com/"
        }
      }
    </script>
    <style>
      /* Los colores del propio juego: el fondo es su color 0 de paleta y el
     violeta es el de los muros del laberinto. */
      :root {
        --bg: #000000;
        --ink: #987dfa;
        --fg: #ffffff;
        --dim: #8a8aa8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }

      /* Emulador a la izquierda, controles a la derecha. Por debajo de
         900px se apilan: el mando no compite con la pantalla en movil. */
      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 28px;
        align-items: start;
      }

      @media (max-width: 900px) {
        .stage {
          grid-template-columns: minmax(0, 1fr);
        }

        /* Vertical, ocupando la pantalla. EmulatorJS dibuja su mando
           tactil DENTRO del contenedor del juego
           (.ejs_virtualGamepad_parent, absoluto con bottom:50px y 130px de
           alto), asi que sobre un contenedor 4:3 se come medio juego.
           Alargando el contenedor a la altura de la pantalla, el mando cae
           en la banda negra de abajo.
           El 120px descuenta el titulo que hay encima. */
        #game {
          aspect-ratio: auto;
          height: calc(100vh - 92px); /* para navegadores sin dvh */
          height: calc(100dvh - 92px);
        }

        /* La pieza que lo hace posible: el canvas sigue llenando el
           contenedor -- no se toca su layout, que es lo que rompio el
           intento anterior -- pero su CONTENIDO se ajusta sin deformarse.
           handleResize() de EmulatorJS no mantiene la proporcion, solo
           alterna clases, asi que sin esto el juego saldria estirado. */
        /* Y el mando, pegado abajo del todo. Por defecto sus zonas van a
           bottom:50px; bajarlas despeja mas hueco entre el juego y el. */
        #game .ejs_virtualGamepad_left,
        #game .ejs_virtualGamepad_right {
          bottom: 16px;
        }

        #game .ejs_canvas {
          object-fit: contain;
          /* Y pegado arriba, no centrado: asi el juego queda en la mitad
             de arriba y el mando solo en la de abajo, separados. Centrado
             (lo que hace contain por defecto) el juego baja hacia los
             controles y se juega incomodo. */
          object-position: top;
        }

        /* El titulo ocupa menos en movil: todo lo que ahorra se lo lleva
           el juego. */
        h1 {
          font-size: 28px;
        }

        main {
          padding-top: 16px;
        }
      }

      .pad svg {
        width: 100%;
        height: auto;
        display: block;
      }

      .legend {
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
        font-size: 13px;
        line-height: 1.5;
      }

      .legend li {
        display: flex;
        gap: 10px;
        padding: 7px 0;
        border-bottom: 1px solid rgba(152, 125, 250, 0.18);
      }

      /* La tecla, dibujada como tecla. Ancho fijo para que la columna de
         descripciones quede alineada. */
      .key {
        flex: 0 0 58px;
        color: var(--ink);
        border: 1px solid rgba(152, 125, 250, 0.5);
        border-radius: 4px;
        padding: 1px 0;
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.06em;
      }

      header {
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 9vw, 56px);
        letter-spacing: 0.18em;
        font-weight: 700;
      }

      .sub {
        margin: 8px 0 0;
        color: var(--ink);
        letter-spacing: 0.14em;
        font-size: 13px;
        text-transform: uppercase;
      }

      /* 320x224 es la resolución real de la consola: 4:3 al presentarla. */
      #game {
        width: 100%;
        aspect-ratio: 4 / 3;
        background: #000;
      }

      .note {
        margin: 20px 0 0;
        color: var(--dim);
        font-size: 13px;
        line-height: 1.6;
      }

      h2 {
        margin: 40px 0 12px;
        font-size: 18px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink);
        font-weight: 700;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 18px;
      }

      td {
        padding: 8px 0;
        border-bottom: 1px solid rgba(152, 125, 250, 0.18);
        vertical-align: top;
      }

      td:first-child {
        width: 38%;
        color: var(--ink);
        white-space: nowrap;
        padding-right: 16px;
      }

      footer {
        margin-top: 48px;
        color: var(--dim);
        font-size: 14px;
        line-height: 1.7;
      }

      a {
        color: var(--ink);
      }
    </style>

  <body>
    <main>
      <header>
        <h1>eres aparvao</h1>
      </header>

      <div class="stage">
        <div id="game"></div>

        <aside class="pad">
          <h2 style="margin-top: 0">Controles</h2>
          <svg viewBox="0 0 300 170" role="img" aria-labelledby="padT padD">
            <title id="padT">
              Mando con las teclas del teclado sobre cada boton
            </title>
            <desc id="padD">move</desc>
            <g fill="none" stroke="#987dfa" stroke-width="2">
              <rect x="6" y="26" width="288" height="116" rx="50" />
              <!-- cruceta -->
              <path
                d="M62 44 h26 v26 h26 v26 h-26 v26 h-26 v-26 h-26 v-26 h26 z"
              />
              <!-- los tres botones, en arco como el mando real -->
              <circle cx="178" cy="100" r="21" />
              <circle cx="222" cy="84" r="21" />
              <circle cx="266" cy="68" r="21" />
            </g>
            <g
              text-anchor="middle"
              font-family="ui-monospace, Menlo, Consolas, monospace"
            >
              <!-- flechas de la cruceta -->
              <g font-size="13" fill="#8a8aa8">
                <text x="75" y="60">&#9650;</text>
                <text x="75" y="118">&#9660;</text>
                <text x="48" y="89">&#9664;</text>
                <text x="102" y="89">&#9654;</text>
              </g>
              <!-- la tecla dentro de cada boton -->
              <g font-size="19" font-weight="700" fill="#ffffff">
                <text x="178" y="107">A</text>
                <text x="222" y="91">S</text>
                <text x="266" y="75">D</text>
              </g>
              <!-- y el boton de consola que es, debajo y dentro del cuerpo -->
              <g font-size="10" fill="#8a8aa8">
                <text x="178" y="134">A</text>
                <text x="222" y="118">B</text>
                <text x="266" y="102">C</text>
              </g>
            </g>
          </svg>

          <ul class="legend">
            <li>
              <span class="key">&#9664;&#9650;&#9660;&#9654;</span>
              <span>move</span>
            </li>
            <li>
              <span class="key">A</span>
              <span>map</span>
            </li>
            <li>
              <span class="key">A+S</span>
              <span>map reveal</span>
            </li>
            <li>
              <span class="key">S</span>
              <span>pathfinder</span>
            </li>
            <li>
              <span class="key">D</span>
              <span>menu: sound on/off </span>
            </li>
          </ul>
        </aside>
      </div>
    </main>

    <script>
      // EmulatorJS se configura con globales antes de cargar su loader.
      EJS_player = "#game";
      EJS_core = "segaMD";
      EJS_gameUrl = "ovni.bin";
      EJS_gameName = "OVNI";
      EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      EJS_color = "#987dfa";
      EJS_startOnLoaded = false;

      // Mando tactil reducido a lo que el juego usa de verdad.
      //
      // Por defecto EmulatorJS monta para segaMD seis botones (A B C y
      // X Y Z), Mode, Start y ademas Fast/Slow, que anade siempre. Son
      // cuatro filas: ocupan casi 350px de alto y se comen el juego. Este
      // juego solo usa cruceta, A, B y C.
      //
      // Definir este array REEMPLAZA el suyo entero, Fast/Slow incluidos.
      // input_value son indices de RetroPad, no de Mega Drive: 1 = A,
      // 0 = B, 8 = C (los mismos que usa su propio array por defecto, de
      // donde estan copiados).
      EJS_VirtualGamepadSettings = [
        {
          type: "dpad",
          id: "dpad",
          location: "left",
          left: "50%",
          right: "50%",
          joystickInput: false,
          inputValues: [4, 5, 6, 7],
        },
        { type: "button", text: "A", id: "a", location: "right", right: 145, top: 40, bold: true, input_value: 1 },
        { type: "button", text: "B", id: "b", location: "right", right: 75, top: 40, bold: true, input_value: 0 },
        { type: "button", text: "C", id: "c", location: "right", right: 5, top: 40, bold: true, input_value: 8 },
      ];


      // Teclas fijadas al cargar, para no depender de las que trae
      // EmulatorJS por defecto.
      //
      // Los indices son los del RetroPad, no los de la Mega Drive, y los
      // dos NO coinciden: Genesis Plus GX (el core de segaMD) mapea
      // A -> RetroPad Y (1), B -> RetroPad B (0) y C -> RetroPad A (8).
      // De ahi que A/S/D vayan en ese orden aparentemente desordenado.
      //   4..7  cruceta
      //   3     START
      // value es la tecla; value2 el boton de un mando fisico, que se
      // deja puesto para que un gamepad siga funcionando igual.
      EJS_defaultControls = {
        0: {
          1: { value: "a", value2: "BUTTON_3" }, // Mega Drive A
          0: { value: "s", value2: "BUTTON_1" }, // Mega Drive B
          8: { value: "d", value2: "BUTTON_2" }, // Mega Drive C
          3: { value: "enter", value2: "START" },
          4: { value: "up arrow", value2: "DPAD_UP" },
          5: { value: "down arrow", value2: "DPAD_DOWN" },
          6: { value: "left arrow", value2: "DPAD_LEFT" },
          7: { value: "right arrow", value2: "DPAD_RIGHT" },
        },
        1: {},
        2: {},
        3: {},
      };
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
  </body>
